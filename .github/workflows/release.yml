name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Faaaaaah" --icon "assets\Faaaaaah.ico" --add-data "assets;assets" main.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\Faaaaaah.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-installer/Faaaaaah-Setup.exe

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh
          codesign --force --deep --sign - dist/Faaaaaah.app

      - name: Create DMG
        run: |
          mkdir -p dist-installer dmg-root
          cp -R dist/Faaaaaah.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Faaaaaah" \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            dist-installer/Faaaaaah.dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist-installer/Faaaaaah.dmg

  linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb

      - name: Build Linux package
        run: |
          chmod +x build-linux.sh
          chmod +x installer/linux/build-tar.sh
          xvfb-run -a ./installer/linux/build-tar.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-installer/*.tar.gz

  release:
    needs:
      - windows
      - macos
      - linux

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd out
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
